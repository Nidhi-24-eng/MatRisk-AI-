version: '3.8'

services:
  # MatRisk AI REST API (FastAPI)
  api:
    build: .
    container_name: matrisk_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped

  # MatRisk AI Interactive Dashboard (Streamlit)
  dashboard:
    build: .
    container_name: matrisk_dashboard
    command: ["streamlit", "run", "src/lab/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
